<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task Board</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <main class="wrap">
    <header>
      <p class="eyebrow">Python + Flask</p>
      <h1>Task Board</h1>
      <p class="sub">Add tasks, mark them done, and check the counts. Jenkins runs the 10 pytest cases on every build.</p>
    </header>

    <section class="panel">
      <form id="task-form">
        <label for="title">New task</label>
        <div class="row">
          <input id="title" name="title" maxlength="80" placeholder="Write a task" required>
          <button type="submit">Add</button>
        </div>
        <p id="form-error" class="error" hidden></p>
      </form>
    </section>

    <section class="stats" id="stats">
      <article><span id="stat-total">0</span><small>Total</small></article>
      <article><span id="stat-done">0</span><small>Done</small></article>
      <article><span id="stat-pending">0</span><small>Pending</small></article>
    </section>

    <section class="panel">
      <h2>Tasks</h2>
      <ul id="task-list"></ul>
      <p id="empty" class="empty">No tasks yet.</p>
    </section>
  </main>
  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
